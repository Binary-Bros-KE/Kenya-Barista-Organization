server {
    listen 80;
    listen [::]:80;
    server_name barista-staging.tanzhotelms.com;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/barista-staging-acme;
    }
    location / {
        return 503;
    }
}
