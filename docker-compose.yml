services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: barista
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: barista
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - barista_local_postgres:/var/lib/postgresql/data
volumes:
  barista_local_postgres:
