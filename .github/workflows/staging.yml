name: Staging checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: barista_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: barista_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barista_ci -d barista_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: development
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-placeholder-secret-never-use-in-production
      EMAIL_MODE: file
      RUN_DB_TESTS: 'true'
      TEST_DATABASE_POOL_MAX: '2'
      DATABASE_URL: postgresql://barista_ci:ci_only_password@127.0.0.1:5432/barista_test
      AUTH_TEST_DATABASE_URL: postgresql://barista_ci:ci_only_password@127.0.0.1:5432/barista_test
      APPLICATION_TEST_DATABASE_URL: postgresql://barista_ci:ci_only_password@127.0.0.1:5432/barista_test
      JOB_TEST_DATABASE_URL: postgresql://barista_ci:ci_only_password@127.0.0.1:5432/barista_test
      NOTIFICATION_TEST_DATABASE_URL: postgresql://barista_ci:ci_only_password@127.0.0.1:5432/barista_test
      RECRUITMENT_TEST_DATABASE_URL: postgresql://barista_ci:ci_only_password@127.0.0.1:5432/barista_test
      PAYMENT_TEST_DATABASE_URL: postgresql://barista_ci:ci_only_password@127.0.0.1:5432/barista_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm test
      - run: node --test tests/deployment.test.mjs
      - name: Production build
        run: npm run build
        env:
          NODE_ENV: production
          APP_URL: https://barista-staging.tanzhotelms.com
